# Install only after the domain and trusted certificate are ready.
# Direct Internet -> Nginx -> loopback services; no Tunnel or panel launcher.
server {
    listen 80;
    listen [::]:80;
    server_name leonard.asia;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/lib/resonance-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leonard.asia;
    ssl_certificate /etc/letsencrypt/live/leonard.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leonard.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512m;
    access_log off;

    location = /resonance-relay/v1 {
        proxy_pass http://127.0.0.1:45902;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location / {
        proxy_pass http://127.0.0.1:8860;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
