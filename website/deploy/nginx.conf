# Replace music.example.com, then let certbot --nginx configure HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;
    client_max_body_size 512m;
    # Author paths and subscription tokens are private; do not save them in access logs.
    access_log off;

    location /static/ {
        alias /opt/resonance/website/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8860;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
