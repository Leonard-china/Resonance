{% extends 'base.html' %}{% from '_macros.html' import icon,fields %}
{% block title %}申请新话题 · Resonance{% endblock %}
{% block main %}<main id="main" class="page-shell form-page"><a class="back-link" href="{{ url_for('forum') }}">{{ icon('arrow-left') }}返回论坛</a><header class="page-heading"><h1>申请新话题</h1><p>作者审核通过后，话题会出现在「其他」分类中。</p></header><form method="post" class="editor-form">{{ fields(csrf) }}<label>话题名称<input name="name" maxlength="30" minlength="2" placeholder="例如：音乐分享" required></label><label>申请理由<textarea name="reason" rows="5" minlength="5" maxlength="1000" placeholder="想讨论什么？为什么需要这个话题？" required></textarea></label><div class="form-actions"><button class="button primary">提交申请</button></div></form></main>{% endblock %}
